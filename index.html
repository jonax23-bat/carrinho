<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simulador de Carrinho de Compras - Etec</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <h1>Programação para Internet II</h1>
  
  <!-- 1. Catálogo / Estoque Fixo -->
  <h2>Tabela de Produtos Disponíveis</h2>
   <label for="input-busca">Buscar produto</label>
    <input type="text" id="input-busca" placeholder="Digite para filtrar...">
  <table>
   
    <thead>
      <tr>
        <th>Código</th>
        <th>Descrição</th>
        <th>Preço Unitário (R$)</th>
        <th>Estoque</th>
      </tr>
    </thead>
    <tbody id="tabela-estoque"></tbody>
  </table>

  <!-- 2. Entrada de Dados -->
  <div class="form-box">
    <h2>Adicionar ao Carrinho</h2>
    <label for="input-codigo">Código:</label>
    <input type="number" id="input-codigo" min="1" placeholder="Ex: 101">

    <label for="input-qtd">Quantidade:</label>
    <input type="number" id="input-qtd" min="1" value="1">

    <button onclick="adicionarAoCarrinho()">Incluir no Carrinho</button>
  </div>

  <!-- 3. Carrinho Dinâmico -->
  <h2>Itens no Carrinho</h2>
  <table>
    <thead>
      <tr>
        <th>Produto</th>
        <th>Quantidade</th>
        <th>Preço Unit.</th>
        <th>Subtotal (R$)</th>
        <th>Ações</th>
      </tr>
    </thead>
    <tbody id="tabela-carrinho">
      <tr><td colspan="5" style="text-align:center;">Carrinho vazio</td></tr>
    </tbody>
  </table>
<!--cupons -->

<h2>Gestor de Cupons (Admin)</h2>
<div class="form-box">
  <label for="input-cupom-codigo">Código do Cupom:</label>
  <input type="text" id="input-cupom-codigo" placeholder="Ex: CHURRASCO15">

  <label for="input-cupom-desconto">Desconto (1 a 100):</label>
  <input type="number" id="input-cupom-desconto" min="1" max="100">

  <button onclick="cadastrarCupom()">Incluir Cupom</button>
</div>

<table>
  <thead>
    <tr>
      <th>Código</th>
      <th>Desconto (%)</th>
      <th>Ações</th>
    </tr>
  </thead>
  <tbody id="tabela-cupons"></tbody>
</table>
  <div class="form-box">
  <h2>Fechamento</h2>
  <label for="input-cupom">Cupom de desconto:</label>
  <input type="text" id="input-cupom" placeholder="Ex: DESCONTO20">
  <button onclick="aplicarCupom()">Aplicar Cupom</button>
</div>

  <!-- 4. Finalização -->
  <button onclick="finalizarCompra()">Finalizar Compra</button>
  <div id="resultado-total" class="total-box"></div>

  <script src="script.js"></script>
</body>
</html>
